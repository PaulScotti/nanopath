data:
  color_jitter: 0.3
  color_jitter_saturation: 0.3
  dataset_dir: /data/nanopath_parquet
  global_crop_scale:
  - 0.4
  - 1.0
  hed_jitter: 0.07
  local_crop_scale:
  - 0.08
  - 0.35
  mean:
  - 0.485
  - 0.456
  - 0.406
  split_seed: 7777
  std:
  - 0.229
  - 0.224
  - 0.225
  tissue_thresh: 0.0
  val_fraction: 0.05
