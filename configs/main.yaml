  lr_min: 1.0e-06
  patch_embed_lr_mult: 0.2
  warmup_fraction: 0.0909
fino:
  continuous:
  - - expr512
    - 1
  - - fga
    - 1
  discrete:
  - - subtype
    - 1
  enabled: true
  gamma_max: 0.7
model:
  type: dinov2_vits14_reg
probe:
  auc_datasets:
  - surgen
  count: 1
  dataset_roots:
    bracs: /block/eva-data/bracs
