  log_every: 20
  max_train_flops: 1000000000000000000
  max_train_samples: 1000000
  num_workers: 16
  persistent_workers: true
  prefetch_factor: 2
  resume: null
  save_every: 1000
  seed: 12
  val_batches: 16
