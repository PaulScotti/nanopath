  model_weights: ema
  robustness_datasets:
  - pathorob
  segmentation_datasets:
  - pannuke
  - monusac
  - consep
  slide_datasets:
  - ucla_lung
  survival_datasets:
  - leopard_bcr
  - cptac_pda_os
project:
  family: nanopath
  name: ryan-validation-s12
  output_dir: /data/$USER/nanopath/ryan-validation/s12
